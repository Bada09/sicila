<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tindari Experience</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #15120f;
  --paper: #fbf8f1;
  --cream: #fff8e9;
  --line: rgba(255, 255, 255, 0.28);
  --soft-line: rgba(21, 18, 15, 0.12);
  --sea: #0c5d70;
  --sea-soft: #dff0ef;
  --coral: #c65c3e;
  --olive: #637844;
  --gold: #e3b551;
  --shadow: 0 24px 80px rgba(0, 0, 0, 0.32);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html {
  scroll-behavior: smooth;
  background: var(--ink);
}

body {
  min-height: 100vh;
  color: var(--paper);
  font-family: "DM Sans", sans-serif;
  background: var(--ink);
  overflow-x: hidden;
}

button, a { font: inherit; }
a { color: inherit; text-decoration: none; }

/* --- Topbar --- */
.topbar {
  position: fixed;
  z-index: 20;
  left: 50%;
  top: 1rem;
  width: min(1180px, calc(100% - 2rem));
  transform: translateX(-50%);
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 1rem;
  transition: all 0.35s ease;
}

body.scrolled .topbar {
  opacity: 0;
  transform: translateX(-50%) translateY(-10px);
  pointer-events: none;
}

.brand-pill, .site-menu, .lang-switch {
  display: inline-flex;
  align-items: center;
  border: 1px solid var(--line);
  background: rgba(10, 18, 20, 0.78);
  backdrop-filter: blur(18px);
  border-radius: 999px;
  min-height: 42px;
}

.brand-pill { padding: 0 1.2rem; font-weight: 800; font-size: 0.84rem; }
.site-menu { padding: 0.25rem; justify-self: center; }
.menu-link { padding: 0 0.8rem; font-size: 0.82rem; font-weight: 800; border-radius: 999px; transition: 0.2s; height: 32px; display: flex; align-items: center; }
.menu-link:hover { background: rgba(255, 255, 255, 0.14); }

.lang-switch { padding: 0.25rem; }
.lang-btn { border: 0; background: transparent; color: #fff; cursor: pointer; padding: 0 0.8rem; height: 32px; border-radius: 999px; font-weight: 800; font-size: 0.72rem; }
.lang-btn.active { background: #fff; color: var(--sea); }

/* --- Hero Section --- */
.hero {
  position: relative;
  min-height: 100vh;
  display: flex;
  align-items: flex-end;
  padding: 4vw;
  background: #10272d url("dia%202%20foto%201.jfif") center/cover no-repeat;
}

.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(15, 18, 21, 0.9), transparent);
}

.hero-inner {
  position: relative;
  width: min(1200px, 100%);
  margin: 0 auto;
  display: grid;
  grid-template-columns: 1fr 400px;
  gap: 4rem;
  align-items: flex-end;
}

h1 { font-family: "Playfair Display", serif; font-size: clamp(3rem, 8vw, 6rem); line-height: 1; margin-bottom: 1.5rem; }
h1 span { color: var(--gold); display: block; }
.hero-copy { max-width: 600px; font-size: 1.2rem; line-height: 1.6; color: rgba(255, 255, 255, 0.9); }

/* --- ITINERARY (Desktop Fix) --- */
.day {
  display: grid;
  grid-template-columns: 1fr 1fr; /* Dividido igualmente no desktop */
  background: var(--ink);
  border-bottom: 1px solid var(--line);
}

.photo-carousel {
  position: sticky;
  top: 0;
  height: 100vh; /* Altura total da tela */
  overflow: hidden;
}

.slides {
  height: 100%;
  display: flex;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scrollbar-width: none;
}

.slide {
  min-width: 100%;
  height: 100%;
  position: relative;
}

.slide img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.day-panel {
  padding: clamp(3rem, 6vw, 6rem);
  background: var(--cream);
  color: var(--ink);
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.day-content-wrapper {
  max-width: 520px; /* Evita linhas de texto muito longas */
  margin: 0 auto;
}

.day-title { font-size: clamp(2rem, 4vw, 3.5rem); font-weight: 800; line-height: 1.1; margin: 1rem 0; }
.day-label { color: var(--coral); font-weight: 900; text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.8rem; }
.badge { display: inline-block; padding: 0.4rem 0.8rem; background: var(--sea-soft); color: var(--sea); border-radius: 999px; font-weight: 800; font-size: 0.8rem; margin-right: 0.5rem; margin-bottom: 0.5rem; }

.block { border-top: 1px solid var(--soft-line); padding: 1.2rem 0; }
.block-label { font-weight: 900; font-size: 0.75rem; text-transform: uppercase; color: var(--olive); margin-bottom: 0.3rem; }
.block-text { font-size: 1rem; line-height: 1.6; color: #333; }

/* --- Sections --- */
.overview, .culture { padding: 10vh 5vw; background: var(--paper); color: var(--ink); }
.overview-inner, .culture-inner { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; align-items: center; }

/* --- Weather --- */
.weather { background: rgba(0,0,0,0.8); padding: 1.5rem; border-radius: 12px; border: 1px solid var(--line); }

/* --- Responsive --- */
@media (max-width: 1024px) {
  .hero-inner, .overview-inner, .culture-inner { grid-template-columns: 1fr; }
  .day { grid-template-columns: 1fr; }
  .photo-carousel { position: relative; height: 50vh; top: auto; }
  .day-panel { padding: 3rem 1.5rem; }
}

@media (max-width: 640px) {
  .topbar { grid-template-columns: 1fr auto; }
  .site-menu { display: none; } /* Simplificação mobile */
  h1 { font-size: 2.5rem; }
}
</style>
</head>
<body>

<nav class="topbar">
  <div class="brand-pill">Tindari Experience</div>
  <div class="site-menu">
    <a class="menu-link" href="#inicio">Home</a>
    <a class="menu-link" href="#famille">Famille</a>
    <a class="menu-link" href="#culture">Culture</a>
    <a class="menu-link" href="#jour-1">Route</a>
  </div>
  <div class="lang-switch" id="langSwitch">
    <button class="lang-btn active" data-lang="fr">FR</button>
    <button class="lang-btn" data-lang="pt">PT</button>
  </div>
</nav>

<header class="hero" id="inicio">
  <div class="hero-inner">
    <div>
      <h1 id="heroTitle">Tindari <span>Experience</span></h1>
      <p class="hero-copy" id="heroCopy">Un itinéraire plein écran en Sicile: plages faciles, villages historiques et îles Éoliennes.</p>
    </div>
    <aside class="weather">
      <div id="weatherTemp" style="font-size: 3rem; font-weight: 800; color: var(--gold);">--°</div>
      <div id="weatherNote">Chargement de la météo...</div>
    </aside>
  </div>
</header>

<main id="itinerary">
  </main>

<script>
const routeDaysData = {
  fr: [
    {
      label: "Jour 1",
      title: "Tindari + Laghetti di Marinello",
      distance: "~15 km",
      rhythm: "Repas ~25€",
      photoNames: ["dia 1 foto 1.jfif", "dia 1 foto 2.jfif", "dia 1 foto 3.jfif"],
      blocks: [
        ["⛪ Culture & foi", "Sanctuaire de Tindari: mosaïques byzantines, Madone Noire et vue panoramique."],
        ["🏖️ Nature & plage", "Laghetti di Marinello: eaux basses et chaudes, parfaites pour les enfants."]
      ]
    },
    {
      label: "Jour 2",
      title: "Etna + Taormine",
      distance: "~200 km",
      rhythm: "Repas ~30€",
      photoNames: ["dia 2 foto 1.jfif", "dia 2 foto 2.jfif", "dia 2 foto 3.jfif"],
      blocks: [
        ["🌋 Volcan", "Crateri Silvestri, à 1 900 m. Montée accessible."],
        ["🏛️ Histoire", "Théâtre antique de Taormine: ruines gréco-romaines avec vue sur l'Etna."]
      ]
    }
  ],
  pt: [
    {
      label: "Dia 1",
      title: "Tindari + Laghetti di Marinello",
      distance: "~15 km",
      rhythm: "Refeição ~25€",
      photoNames: ["dia 1 foto 1.jfif", "dia 1 foto 2.jfif", "dia 1 foto 3.jfif"],
      blocks: [
        ["⛪ Cultura & Fé", "Santuário de Tindari: mosaicos bizantinos, Madona Negra e vista panorâmica."],
        ["🏖️ Natureza & Praia", "Laghetti di Marinello: águas rasas e quentes, ideais para famílias."]
      ]
    },
    {
      label: "Dia 2",
      title: "Etna + Taormina",
      distance: "~200 km",
      rhythm: "Refeição ~30€",
      photoNames: ["dia 2 foto 1.jfif", "dia 2 foto 2.jfif", "dia 2 foto 3.jfif"],
      blocks: [
        ["🌋 Vulcão", "Crateras Silvestri a 1.900m. Subida acessível."],
        ["🏛️ História", "Teatro Antigo de Taormina: ruínas com vista para o vulcão."]
      ]
    }
  ]
};

let currentLang = "fr";

function render() {
  const container = document.getElementById("itinerary");
  const data = routeDaysData[currentLang];
  
  container.innerHTML = data.map((day, idx) => `
    <article class="day" id="jour-${idx+1}">
      <div class="photo-carousel">
        <div class="slides">
          ${day.photoNames.map(img => `
            <div class="slide">
              <img src="${img.replace(/ /g, '%20')}" alt="Sicilia" onerror="this.src='https://images.unsplash.com/photo-1533106497176-45ae19e68ba2?auto=format&fit=crop&w=800'">
            </div>
          `).join('')}
        </div>
      </div>
      <div class="day-panel">
        <div class="day-content-wrapper">
          <span class="day-label">${day.label}</span>
          <h2 class="day-title">${day.title}</h2>
          <div style="margin-bottom: 2rem;">
            <span class="badge">${day.distance}</span>
            <span class="badge">${day.rhythm}</span>
          </div>
          <div class="blocks">
            ${day.blocks.map(b => `
              <div class="block">
                <div class="block-label">${b[0]}</div>
                <p class="block-text">${b[1]}</p>
              </div>
            `).join('')}
          </div>
        </div>
      </div>
    </article>
  `).join('');
}

document.getElementById("langSwitch").addEventListener("click", (e) => {
  if(e.target.dataset.lang) {
    currentLang = e.target.dataset.lang;
    document.querySelectorAll(".lang-btn").forEach(b => b.classList.toggle("active", b.dataset.lang === currentLang));
    render();
  }
});

// Efeito de scroll para a barra de navegação
window.addEventListener("scroll", () => {
  document.body.classList.toggle("scrolled", window.scrollY > 50);
});

render();
</script>
</body>
</html>
