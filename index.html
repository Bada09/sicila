<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<title>Tindari · Sicília 2025</title>
<style>
:root {
  --sand: #f7efe0;
  --terra: #c05a28;
  --terra-2: #e07848;
  --sea: #1e5f7a;
  --sea-2: #3a8aab;
  --olive: #3d5220;
  --gold: #c8992a;
  --gold-2: #f0c050;
  --ink: #160e04;
  --cream: #fdf8ef;
  --muted: #8a7060;
  --white: #ffffff;
  --purple: #6a3e8a;
  --rust: #b84820;
  --blue: #2060a0;
  --card-shadow: 0 4px 28px rgba(22,14,4,0.1);
  --nav-h: 70px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;overflow-x:hidden;padding-bottom:var(--nav-h);}

/* ── HERO ── */
.hero{position:relative;height:92svh;min-height:480px;max-height:700px;overflow:hidden;}
.hero-bg{position:absolute;inset:0;transition:opacity 0.8s ease;}
.hero-bg.bg-0{background:linear-gradient(145deg,#071e30 0%,#0d3d58 40%,#1a6048 100%);}
.hero-bg.bg-1{background:linear-gradient(145deg,#2e0e04 0%,#a04018 50%,#602010 100%);}
.hero-bg.bg-2{background:linear-gradient(145deg,#0a0a2a 0%,#1e2060 50%,#6030a0 100%);}
.hero-bg.bg-3{background:linear-gradient(145deg,#100800 0%,#401a04 40%,#a07818 100%);}
.hero-bg:not(.active){opacity:0;pointer-events:none;}
.hero-slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:clamp(1.2rem,5vw,2.5rem);padding-bottom:clamp(4.5rem,10vw,6rem);opacity:0;transition:opacity 0.7s ease;pointer-events:none;}
.hero-slide.active{opacity:1;pointer-events:auto;}
.slide-chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.12);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.2);border-radius:50px;padding:0.28rem 0.9rem;font-size:0.68rem;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:rgba(255,255,255,0.85);margin-bottom:0.9rem;}
.slide-h1{font-family:'Playfair Display',serif;font-size:clamp(2.6rem,10vw,4.2rem);font-weight:900;line-height:1.02;color:#fff;text-shadow:0 3px 24px rgba(0,0,0,0.35);margin-bottom:0.6rem;}
.slide-h1 em{font-style:italic;color:var(--gold-2);}
.slide-desc{color:rgba(255,255,255,0.7);font-size:clamp(0.78rem,3vw,0.92rem);font-weight:300;line-height:1.6;max-width:320px;}
.hero-emoji{position:absolute;font-size:clamp(4.5rem,18vw,8rem);top:10%;right:6%;pointer-events:none;filter:drop-shadow(0 10px 30px rgba(0,0,0,0.3));animation:floatIt 4s ease-in-out infinite;}
@keyframes floatIt{0%,100%{transform:translateY(0) rotate(-4deg);}50%{transform:translateY(-14px) rotate(4deg);}}

.hero-dots{position:absolute;bottom:1.4rem;left:50%;transform:translateX(-50%);display:flex;gap:7px;z-index:10;}
.hdot{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,0.35);transition:all 0.3s;cursor:pointer;}
.hdot.on{width:26px;background:var(--gold);}

.lang-row{position:absolute;top:1rem;right:1rem;display:flex;gap:6px;z-index:20;}
.lbtn{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.22);color:rgba(255,255,255,0.7);padding:0.28rem 0.8rem;border-radius:50px;font-family:'DM Sans',sans-serif;font-size:0.72rem;cursor:pointer;transition:all 0.2s;backdrop-filter:blur(8px);}
.lbtn.on{background:var(--gold);border-color:var(--gold);color:#1a0e00;font-weight:600;}

.scroll-hint{position:absolute;bottom:1.5rem;right:1.2rem;display:flex;flex-direction:column;align-items:center;gap:4px;color:rgba(255,255,255,0.4);font-size:0.6rem;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;z-index:10;}
.arrow-down{width:20px;height:20px;border-right:2px solid rgba(255,255,255,0.35);border-bottom:2px solid rgba(255,255,255,0.35);transform:rotate(45deg);animation:bounce 1.6s ease-in-out infinite;}
@keyframes bounce{0%,100%{transform:rotate(45deg) translateY(0);}50%{transform:rotate(45deg) translateY(6px);}}

/* ── BOTTOM NAV ── */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);background:rgba(253,248,239,0.92);backdrop-filter:blur(18px);border-top:1px solid rgba(200,153,42,0.18);display:flex;align-items:stretch;z-index:100;}
.nav-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;transition:all 0.2s;border:none;background:none;padding:0.4rem 0;position:relative;}
.nav-tab .n-icon{font-size:1.35rem;transition:transform 0.2s;}
.nav-tab .n-label{font-size:0.58rem;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:var(--muted);transition:color 0.2s;}
.nav-tab.on .n-icon{transform:translateY(-2px);}
.nav-tab.on .n-label{color:var(--terra);}
.nav-tab.on::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:32px;height:3px;background:var(--terra);border-radius:3px 3px 0 0;}

/* ── PAGES ── */
.page{display:none;padding:1.4rem 0.9rem 1rem;max-width:680px;margin:0 auto;}
.page.on{display:block;}

.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1.4rem;}
.stat-pill{background:var(--white);border-radius:16px;padding:0.8rem 0.4rem;text-align:center;box-shadow:0 2px 14px rgba(22,14,4,0.07);border:1px solid rgba(200,153,42,0.12);}
.s-icon{font-size:1.3rem;margin-bottom:3px;}
.s-num{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:700;color:var(--terra);line-height:1;}
.s-lbl{font-size:0.6rem;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:var(--muted);margin-top:2px;}

.tip{background:linear-gradient(135deg,#e8f4e6,#d0ecda);border-left:4px solid var(--olive);border-radius:14px;padding:0.9rem 1.1rem;margin-bottom:1.6rem;display:flex;gap:10px;font-size:0.82rem;line-height:1.65;}
.tip-ico{font-size:1.3rem;flex-shrink:0;}
.tip strong{color:var(--olive);}

.sec-hdr{font-family:'Playfair Display',serif;font-size:1.55rem;font-weight:700;color:var(--ink);margin-bottom:1.2rem;display:flex;align-items:center;gap:8px;}

/* ── TIMELINE ── */
.timeline{position:relative;display:flex;flex-direction:column;gap:0;}
.timeline::before{content:'';position:absolute;left:19px;top:28px;bottom:28px;width:2px;background:linear-gradient(to bottom,var(--sea),var(--olive),var(--terra),var(--purple),var(--rust),var(--gold));opacity:0.2;}

.day-row{position:relative;padding-left:54px;padding-bottom:1.4rem;opacity:0;transform:translateY(18px);transition:opacity 0.5s ease,transform 0.5s ease;}
.day-row.vis{opacity:1;transform:translateY(0);}
.day-num{position:absolute;left:4px;top:8px;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.72rem;color:#fff;z-index:2;border:3px solid var(--cream);box-shadow:0 3px 10px rgba(0,0,0,0.22);}
.dc0{background:var(--sea);}
.dc1{background:var(--olive);}
.dc2{background:var(--terra);}
.dc3{background:var(--purple);}
.dc4{background:var(--rust);}
.dc5{background:var(--gold);}
.dc6{background:var(--blue);}

.day-card{background:var(--white);border-radius:20px;overflow:hidden;box-shadow:var(--card-shadow);border:1px solid rgba(200,153,42,0.1);}
.card-top{padding:1rem 1.1rem 0.85rem;display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--sand);}
.day-tag{font-size:0.62rem;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--terra);margin-bottom:0.25rem;}
.day-name{font-family:'Playfair Display',serif;font-size:1.08rem;font-weight:700;line-height:1.25;color:var(--ink);}
.dist-tag{background:#eef4f8;padding:0.22rem 0.6rem;border-radius:40px;font-size:0.62rem;font-weight:700;color:var(--sea);white-space:nowrap;flex-shrink:0;}

/* ── FOTOS DO DIA ── */
.day-photos {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  padding: 0.8rem 1.1rem;
}
.day-photos img {
  width: 100%;
  aspect-ratio: 4 / 3;
  object-fit: cover;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  transition: transform 0.2s;
  cursor: pointer;
}
.day-photos img:active {
  transform: scale(1.03);
}

.block{display:flex;gap:0.8rem;padding:0.72rem 1.1rem;border-bottom:1px dashed rgba(200,153,42,0.15);transition:background 0.15s;}
.block:last-child{border-bottom:none;}
.block:active{background:rgba(200,153,42,0.05);}
.b-ico{font-size:1.25rem;flex-shrink:0;width:28px;text-align:center;padding-top:1px;}
.b-info{flex:1;min-width:0;}
.b-cat{font-size:0.6rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--sea-2);margin-bottom:0.18rem;}
.b-txt{font-size:0.83rem;color:#3a2e1a;line-height:1.55;}
.map-btn{display:inline-flex;align-items:center;gap:4px;font-size:0.68rem;color:var(--terra);font-weight:700;background:rgba(192,90,40,0.08);padding:0.2rem 0.6rem;border-radius:20px;text-decoration:none;margin-top:5px;transition:background 0.15s;}
.map-btn:hover,.map-btn:active{background:rgba(192,90,40,0.16);}

/* ── MAP PAGE ── */
.map-intro{background:var(--white);border-radius:18px;padding:1.1rem;margin-bottom:1.2rem;box-shadow:var(--card-shadow);}
.map-intro p{font-size:0.85rem;line-height:1.65;color:var(--muted);}
.stops-list{display:flex;flex-direction:column;gap:10px;}
.stop-card{background:var(--white);border-radius:16px;padding:0.85rem 1rem;display:flex;align-items:center;gap:1rem;box-shadow:0 2px 12px rgba(22,14,4,0.07);border:1px solid rgba(200,153,42,0.1);text-decoration:none;transition:transform 0.15s,box-shadow 0.15s;}
.stop-card:active{transform:scale(0.99);box-shadow:0 1px 6px rgba(22,14,4,0.1);}
.stop-num{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.8rem;color:#fff;flex-shrink:0;}
.stop-name{font-family:'Playfair Display',serif;font-size:1rem;font-weight:700;color:var(--ink);}
.stop-meta{font-size:0.72rem;color:var(--muted);margin-top:1px;}
.stop-arrow{margin-left:auto;color:var(--muted);font-size:1rem;}

/* ── INFO PAGE ── */
.info-cards{display:flex;flex-direction:column;gap:1rem;}
.info-card{background:var(--white);border-radius:18px;overflow:hidden;box-shadow:var(--card-shadow);}
.info-card-hdr{padding:1rem 1.1rem;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--sand);}
.info-card-hdr .i-ico{font-size:1.4rem;}
.info-card-hdr h3{font-family:'Playfair Display',serif;font-size:1.05rem;font-weight:700;color:var(--ink);}
.info-card-body{padding:1rem 1.1rem;font-size:0.83rem;line-height:1.7;color:#3a2e1a;}
.info-card-body ul{padding-left:1.2rem;}
.info-card-body li{margin-bottom:4px;}
.info-card-body strong{color:var(--terra);}

/* ── CONTACT PAGE ── */
.contact-hero{background:linear-gradient(135deg,var(--sea),var(--blue));border-radius:20px;padding:1.5rem;color:#fff;margin-bottom:1.4rem;text-align:center;}
.contact-hero h2{font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:700;margin-bottom:0.4rem;}
.contact-hero p{font-size:0.82rem;opacity:0.8;line-height:1.6;}
.form-box{background:var(--white);border-radius:20px;padding:1.2rem;box-shadow:var(--card-shadow);}
.fg{margin-bottom:1rem;}
.fg label{display:block;font-size:0.68rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}
.fg input,.fg textarea{width:100%;padding:10px 14px;border:1.5px solid #e0d0b8;border-radius:30px;font-family:'DM Sans',sans-serif;font-size:0.85rem;background:#fefcf8;color:var(--ink);outline:none;transition:border-color 0.2s;}
.fg input:focus,.fg textarea:focus{border-color:var(--terra);}
.fg textarea{border-radius:16px;resize:vertical;min-height:90px;}
.send-btn{background:var(--terra);color:#fff;border:none;padding:12px 22px;border-radius:50px;font-weight:700;cursor:pointer;transition:background 0.2s;font-size:0.88rem;display:inline-flex;align-items:center;gap:8px;width:100%;justify-content:center;}
.send-btn:hover{background:var(--terra-2);}
.fb-msg{margin-top:10px;font-size:0.75rem;text-align:center;}

.rating-row{display:flex;gap:8px;margin-bottom:1.4rem;}
.rate-card{flex:1;background:var(--white);border-radius:14px;padding:0.8rem 0.5rem;text-align:center;box-shadow:0 2px 12px rgba(22,14,4,0.07);cursor:pointer;transition:all 0.2s;border:1.5px solid transparent;}
.rate-card:hover,.rate-card.sel{border-color:var(--gold);background:rgba(200,153,42,0.05);}
.rate-icon{font-size:1.4rem;margin-bottom:4px;}
.rate-lbl{font-size:0.62rem;font-weight:600;text-transform:uppercase;letter-spacing:0.8px;color:var(--muted);}

footer{text-align:center;padding:1.8rem 1rem 0.8rem;font-size:0.72rem;color:var(--muted);border-top:1px dashed #e0c8a0;margin:0 0.9rem;}
.footer-brand{font-family:'Playfair Display',serif;font-style:italic;font-size:1.2rem;color:var(--terra);display:block;margin-bottom:4px;}

@media(max-width:420px){
.stat-grid{grid-template-columns:repeat(2,1fr);}
.slide-h1{font-size:2.3rem;}
}
</style>
</head>
<body>

<!-- HERO -->
<div class="hero" id="hero">
  <div class="hero-bg bg-0 active" id="hbg0"></div>
  <div class="hero-bg bg-1" id="hbg1"></div>
  <div class="hero-bg bg-2" id="hbg2"></div>
  <div class="hero-bg bg-3" id="hbg3"></div>

  <div class="lang-row" id="langRow">
    <button class="lbtn on" data-l="pt">🇧🇷 PT</button>
    <button class="lbtn" data-l="fr">🇫🇷 FR</button>
  </div>

  <!-- slide 0 -->
  <div class="hero-slide active" id="hs0">
    <div class="hero-emoji">⛵</div>
    <div class="slide-chip" id="c0"></div>
    <div class="slide-h1" id="h0"></div>
    <div class="slide-desc" id="d0"></div>
  </div>
  <!-- slide 1 -->
  <div class="hero-slide" id="hs1">
    <div class="hero-emoji">🌋</div>
    <div class="slide-chip" id="c1"></div>
    <div class="slide-h1" id="h1"></div>
    <div class="slide-desc" id="d1"></div>
  </div>
  <!-- slide 2 -->
  <div class="hero-slide" id="hs2">
    <div class="hero-emoji">🚤</div>
    <div class="slide-chip" id="c2"></div>
    <div class="slide-h1" id="h2"></div>
    <div class="slide-desc" id="d2"></div>
  </div>
  <!-- slide 3 -->
  <div class="hero-slide" id="hs3">
    <div class="hero-emoji">🏛️</div>
    <div class="slide-chip" id="c3"></div>
    <div class="slide-h1" id="h3"></div>
    <div class="slide-desc" id="d3"></div>
  </div>

  <div class="hero-dots" id="heroDots">
    <div class="hdot on" data-i="0"></div>
    <div class="hdot" data-i="1"></div>
    <div class="hdot" data-i="2"></div>
    <div class="hdot" data-i="3"></div>
  </div>
  <div class="scroll-hint"><div class="arrow-down"></div></div>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav" id="bottomNav">
  <button class="nav-tab on" data-page="prog"><span class="n-icon">📅</span><span class="n-label" data-key="nav1"></span></button>
  <button class="nav-tab" data-page="map"><span class="n-icon">🗺️</span><span class="n-label" data-key="nav2"></span></button>
  <button class="nav-tab" data-page="info"><span class="n-icon">ℹ️</span><span class="n-label" data-key="nav3"></span></button>
  <button class="nav-tab" data-page="contact"><span class="n-icon">✍️</span><span class="n-label" data-key="nav4"></span></button>
</nav>

<!-- PAGE: PROGRAMA -->
<div class="page on" id="page-prog">
  <div class="stat-grid">
    <div class="stat-pill"><div class="s-icon">🗓️</div><div class="s-num">7</div><div class="s-lbl" data-key="s1"></div></div>
    <div class="stat-pill"><div class="s-icon">👥</div><div class="s-num">22</div><div class="s-lbl" data-key="s2"></div></div>
    <div class="stat-pill"><div class="s-icon">📍</div><div class="s-num">12</div><div class="s-lbl" data-key="s3"></div></div>
    <div class="stat-pill"><div class="s-icon">🌡️</div><div class="s-num">28°</div><div class="s-lbl" data-key="s4"></div></div>
  </div>
  <div class="tip" id="tipBanner"><span class="tip-ico">🧳</span><span id="tipText"></span></div>
  <div class="sec-hdr">📅 Programa</div>
  <div class="timeline" id="timeline"></div>
  <footer><span class="footer-brand">Tindari · Sicília autêntica</span>Roteiro otimizado · famílias multigeracionais · 3 a 80 anos</footer>
</div>

<!-- PAGE: MAPA -->
<div class="page" id="page-map">
  <div class="sec-hdr" id="mapHdr"></div>
  <div class="map-intro"><p id="mapIntro"></p></div>
  <div class="stops-list" id="stopsList"></div>
</div>

<!-- PAGE: INFOS -->
<div class="page" id="page-info">
  <div class="sec-hdr" id="infoHdr"></div>
  <div class="info-cards" id="infoCards"></div>
</div>

<!-- PAGE: CONTATO -->
<div class="page" id="page-contact">
  <div class="contact-hero">
    <h2 id="cHdr"></h2>
    <p id="cSub"></p>
  </div>
  <div id="ratingLabel" style="font-size:0.78rem;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:0.7rem;"></div>
  <div class="rating-row">
    <div class="rate-card" data-r="1"><div class="rate-icon">😐</div><div class="rate-lbl" id="r1"></div></div>
    <div class="rate-card" data-r="2"><div class="rate-icon">😊</div><div class="rate-lbl" id="r2"></div></div>
    <div class="rate-card" data-r="3"><div class="rate-icon">🤩</div><div class="rate-lbl" id="r3"></div></div>
  </div>
  <div class="form-box">
    <div class="fg"><label id="lb1"></label><input type="text" id="iName"></div>
    <div class="fg"><label id="lb2"></label><input type="email" id="iEmail"></div>
    <div class="fg"><label id="lb3"></label><textarea id="iMsg"></textarea></div>
    <button class="send-btn" id="sendBtn">📧 <span id="sendTxt"></span></button>
    <div id="fbMsg" class="fb-msg"></div>
  </div>
</div>

<script>
const TX = {
  pt: {
    nav:['Programa','Mapa','Infos','Contato'],
    stats:['Dias','Pessoas','Paradas','Verão'],
    secHdr:'📅 Programa',
    mapHdr:'🗺️ Paradas da viagem',
    mapIntro:'Todas as paradas da viagem, em ordem. Clique para abrir no Google Maps.',
    infoHdr:'ℹ️ Informações práticas',
    tip:'Para as praias, reserve sempre um <strong>Lido</strong> com antecedência. Dia 5 (Lipari): saída de Milazzo, barco ~1h. Protetor solar e calçado confortável indispensáveis.',
    mapBtn:'Ver no mapa →',
    ratingLbl:'Sua avaliação da viagem',
    ratings:['Neutro','Bom','Perfeito!'],
    cHdr:'Escrever para Charlotte',
    cSub:'Dúvidas, sugestões e comentários sobre a viagem',
    lb:['Seu nome','E-mail','Mensagem'],
    sendTxt:'Enviar para Charlotte',
    slides:[
      {chip:'🇮🇹 Sicília · 7 dias', h:'<em>Tindari</em><br>Experiência', d:'Cultura · Vulcões · Ilhas Eólias — de 3 a 80 anos'},
      {chip:'Dia 2 · Destaque', h:'Etna &<br><em>Taormina</em>', d:'Crateri Silvestri · Granita · Teatro Antigo'},
      {chip:'Dia 5 · Mar', h:'Ilhas<br><em>Eólias</em>', d:'Lipari · Vulcano · Saída de Milazzo'},
      {chip:'Dia 4 · UNESCO', h:'<em>Cefalù</em><br>& Mediterrâneo', d:'Catedral normanda · Museu Mandralisca · Praia'}
    ],
    days:[

    stopMaps:['https://www.google.com/maps/search/?api=1&query=Santuario+di+Tindari+Sicily','https://www.google.com/maps/search/?api=1&query=Laghetti+di+Marinello+Oliveri','https://www.google.com/maps/search/?api=1&query=Crateri+Silvestri+Etna','https://www.google.com/maps/search/?api=1&query=Gole+Alcantara','https://www.google.com/maps/search/?api=1&query=Teatro+Antico+Taormina','https://www.google.com/maps/search/?api=1&query=Montalbano+Elicona+Messina','https://www.google.com/maps/search/?api=1&query=Argimusco+Megaliths+Sicily','https://www.google.com/maps/search/?api=1&query=Cattedrale+di+Cefalù+UNESCO','https://www.google.com/maps/search/?api=1&query=Museo+Mandralisca+Cefalù','https://www.google.com/maps/search/?api=1&query=Porto+di+Milazzo','https://www.google.com/maps/search/?api=1&query=Lipari+Castello','https://www.google.com/maps/search/?api=1&query=Spiaggia+Capo+d+Orlando','https://www.google.com/maps/search/?api=1&query=Ristorante+Donna+Villa+Patti']
  }
};

const COLORS = ['dc0','dc1','dc2','dc3','dc4','dc5'];
let lang = 'pt';
let curSlide = 0;
let autoT;
const NSLIDES = 4;

function goSlide(n){
  curSlide = ((n%NSLIDES)+NSLIDES)%NSLIDES;
  ['hbg0','hbg1','hbg2','hbg3'].forEach((id,i)=>{
    document.getElementById(id).classList.toggle('active',i===curSlide);
  });
  document.querySelectorAll('.hero-slide').forEach((el,i)=>el.classList.toggle('active',i===curSlide));
  document.querySelectorAll('.hdot').forEach((d,i)=>d.classList.toggle('on',i===curSlide));
}
function startAuto(){clearInterval(autoT);autoT=setInterval(()=>goSlide(curSlide+1),4800);}
let tx0=null;
document.getElementById('hero').addEventListener('touchstart',e=>{tx0=e.touches[0].clientX;},{passive:true});
document.getElementById('hero').addEventListener('touchend',e=>{
  if(tx0===null)return;
  const dx=e.changedTouches[0].clientX-tx0;
  if(Math.abs(dx)>40){goSlide(curSlide+(dx<0?1:-1));startAuto();}
  tx0=null;
},{passive:true});
document.getElementById('heroDots').addEventListener('click',e=>{
  const d=e.target.closest('.hdot');if(d){goSlide(+d.dataset.i);startAuto();}
});

document.getElementById('bottomNav').addEventListener('click',e=>{
  const tab=e.target.closest('.nav-tab');
  if(!tab)return;
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('on'));
  tab.classList.add('on');
  const pg=tab.dataset.page;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));
  document.getElementById('page-'+pg).classList.add('on');
  window.scrollTo({top:document.getElementById('hero').offsetHeight,behavior:'smooth'});
});

const obs = new IntersectionObserver(entries=>{
  entries.forEach(e=>{if(e.isIntersecting)e.target.classList.add('vis');});
},{threshold:0.1,rootMargin:'0px 0px -30px 0px'});

document.querySelectorAll('.rate-card').forEach(c=>{
  c.addEventListener('click',()=>{
    document.querySelectorAll('.rate-card').forEach(x=>x.classList.remove('sel'));
    c.classList.add('sel');
  });
});

function render(){
  const T=TX[lang];
  T.slides.forEach((s,i)=>{
    document.getElementById('c'+i).textContent=s.chip;
    document.getElementById('h'+i).innerHTML=s.h;
    document.getElementById('d'+i).textContent=s.d;
  });
  document.querySelectorAll('.lbtn').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
  T.stats.forEach((v,i)=>document.querySelectorAll('.s-lbl')[i].textContent=v);
  document.getElementById('tipText').innerHTML=T.tip;
  document.getElementById('mapHdr').textContent=T.mapHdr;
  document.getElementById('mapIntro').textContent=T.mapIntro;
  document.getElementById('infoHdr').textContent=T.infoHdr;
  document.querySelectorAll('.n-label').forEach((el,i)=>el.textContent=T.nav[i]);
  document.getElementById('ratingLabel').textContent=T.ratingLbl;
  document.getElementById('r1').textContent=T.ratings[0];
  document.getElementById('r2').textContent=T.ratings[1];
  document.getElementById('r3').textContent=T.ratings[2];
  document.getElementById('cHdr').textContent=T.cHdr;
  document.getElementById('cSub').textContent=T.cSub;
  ['lb1','lb2','lb3'].forEach((id,i)=>document.getElementById(id).textContent=T.lb[i]);
  document.getElementById('sendTxt').textContent=T.sendTxt;

  const tl=document.getElementById('timeline');
  tl.innerHTML=T.days.map((day,i)=>{
    const dayNum = i+1;
    const photoGrid = `
      <div class="day-photos">
        <img src="dia ${dayNum} foto 1.jfif" alt="Dia ${dayNum} - Foto 1" onerror="this.style.display='none'">
        <img src="dia ${dayNum} foto 2.jfif" alt="Dia ${dayNum} - Foto 2" onerror="this.style.display='none'">
        <img src="dia ${dayNum} foto 3.jfif" alt="Dia ${dayNum} - Foto 3" onerror="this.style.display='none'">
      </div>
    `;
    return `
    <div class="day-row">
      <div class="day-num ${COLORS[i]}">${dayNum}</div>
      <div class="day-card">
        <div class="card-top">
          <div>
            <div class="day-tag">${day.lbl}</div>
            <div class="day-name">${day.title}</div>
            <div style="font-size:0.7rem;color:var(--muted);margin-top:4px;font-weight:500;">💰 ${day.budget}</div>
          </div>
          <div class="dist-tag">🚐 ${day.dist}</div>
        </div>
        ${photoGrid}
        <div class="card-body">
          ${day.blocks.map(b=>`
            <div class="block">
              <div class="b-ico">${b.ico}</div>
              <div class="b-info">
                <div class="b-cat">${b.cat}</div>
                <div class="b-txt">${b.txt}</div>
                <a href="${b.map}" target="_blank" rel="noopener" class="map-btn">📍 ${T.mapBtn}</a>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
    `;
  }).join('');
  document.querySelectorAll('.day-row').forEach(el=>obs.observe(el));

  const stopColors=['#1e5f7a','#3d5220','#c05a28','#6a3e8a','#b84820','#c8992a','#1e5f7a','#2060a0','#3d5220','#c05a28','#6a3e8a','#b84820','#c8992a'];
  document.getElementById('stopsList').innerHTML=T.stopNames.map((name,i)=>`
    <a href="${T.stopMaps[i]}" target="_blank" rel="noopener" class="stop-card">
      <div class="stop-num" style="background:${stopColors[i]}">${i+1}</div>
      <div class="stop-info">
        <div class="stop-name">${name}</div>
        <div class="stop-meta">${T.stopMeta[i]}</div>
      </div>
      <div class="stop-arrow">›</div>
    </a>
  `).join('');

  document.getElementById('infoCards').innerHTML=T.info.map(c=>`
    <div class="info-card">
      <div class="info-card-hdr"><span class="i-ico">${c.ico}</span><h3>${c.title}</h3></div>
      <div class="info-card-body">${c.body}</div>
    </div>
  `).join('');
}

document.getElementById('langRow').addEventListener('click',e=>{
  const b=e.target.closest('.lbtn');
  if(b&&b.dataset.l!==lang){lang=b.dataset.l;render();}
});

document.getElementById('sendBtn').addEventListener('click',()=>{
  const T=TX[lang];
  const nome=document.getElementById('iName').value.trim();
  const email=document.getElementById('iEmail').value.trim();
  const msg=document.getElementById('iMsg').value.trim();
  const rating=document.querySelector('.rate-card.sel')?.dataset.r||'—';
  const fb=document.getElementById('fbMsg');
  if(!nome||!msg){
    fb.innerHTML=`<span style="color:var(--terra)">⚠️ ${lang==='pt'?'Nome e mensagem obrigatórios.':'Nom et message obligatoires.'}</span>`;
    return;
  }
  const subj=`Tindari Sicília — ${nome}`;
  const body=`Nome: ${nome}%0AEmail: ${email||'—'}%0ANota: ${rating}/3%0A%0AMensagem:%0A${encodeURIComponent(msg)}`;
  window.location.href=`mailto:charlotte.tabajara@gmail.com?subject=${encodeURIComponent(subj)}&body=${body}`;
  fb.innerHTML=`<span style="color:var(--olive)">📧 ${lang==='pt'?'Seu e-mail será aberto. Envie para finalizar.':'Votre client email va s\'ouvrir. Envoyez pour finaliser.'}</span>`;
  setTimeout(()=>fb.innerHTML='',6000);
});

render();
startAuto();
</script>
</body>
</html>
