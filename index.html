<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tindari Experience</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #15120f;
  --paper: #fbf8f1;
  --cream: #fff8e9;
  --line: rgba(255, 255, 255, 0.28);
  --soft-line: rgba(21, 18, 15, 0.12);
  --sea: #0c5d70;
  --sea-soft: #dff0ef;
  --coral: #c65c3e;
  --olive: #637844;
  --gold: #e3b551;
  --shadow: 0 24px 80px rgba(0, 0, 0, 0.32);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html {
  scroll-behavior: smooth;
  scroll-snap-type: y proximity;
  background: var(--ink);
}

body {
  min-height: 100vh;
  color: var(--paper);
  font-family: "DM Sans", sans-serif;
  background: var(--ink);
  overflow-x: hidden;
}

button,
a { font: inherit; }

a { color: inherit; }

.screen {
  position: relative;
  min-height: 100svh;
  scroll-snap-align: start;
  isolation: isolate;
}

.hero {
  display: grid;
  align-items: end;
  padding: clamp(1rem, 4vw, 3rem);
  background: #10272d;
  overflow: hidden;
}

.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -2;
  background:
    linear-gradient(90deg, rgba(12, 45, 55, 0.94), rgba(12, 45, 55, 0.48) 48%, rgba(21, 18, 15, 0.15)),
    linear-gradient(0deg, rgba(21, 18, 15, 0.72), rgba(21, 18, 15, 0.08) 55%),
    url("dia 2 foto 1.jfif") center / cover;
  transform: scale(1.02);
}

.topbar {
  position: fixed;
  z-index: 20;
  left: 50%;
  top: 1rem;
  width: min(1180px, calc(100% - 2rem));
  transform: translateX(-50%);
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 1rem;
  pointer-events: none;
  opacity: 1;
  transition: opacity 0.35s ease, transform 0.35s ease;
}

.topbar::before {
  content: "";
  position: fixed;
  z-index: -1;
  left: 0;
  right: 0;
  top: 0;
  height: 5.75rem;
  background: linear-gradient(to bottom, rgba(5, 11, 13, 0.86), rgba(5, 11, 13, 0));
  pointer-events: none;
}

body.scrolled .topbar {
  opacity: 0;
  pointer-events: none;
  transform: translateX(-50%) translateY(-10px);
}

.brand-pill,
.site-menu,
.lang-switch {
  pointer-events: auto;
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  border: 1px solid rgba(255, 255, 255, 0.32);
  background: rgba(10, 18, 20, 0.78);
  color: #fff;
  backdrop-filter: blur(18px);
  box-shadow: 0 14px 40px rgba(0, 0, 0, 0.18);
}

.brand-pill {
  min-height: 42px;
  border-radius: 999px;
  padding: 0 0.95rem;
  font-weight: 800;
  font-size: 0.84rem;
}

.site-menu {
  justify-self: center;
  min-height: 42px;
  border-radius: 999px;
  padding: 0.25rem;
}

.menu-link {
  min-height: 32px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  padding: 0 0.8rem;
  color: #fff;
  text-decoration: none;
  font-size: 0.82rem;
  font-weight: 800;
  white-space: nowrap;
  transition: background 0.2s ease, color 0.2s ease;
}

.menu-link:hover {
  background: rgba(255, 255, 255, 0.14);
  color: #fff;
}

.lang-switch {
  border-radius: 999px;
  padding: 0.25rem;
  transition: opacity 0.22s ease, transform 0.22s ease, visibility 0.22s ease;
}

.lang-btn {
  min-width: 66px;
  min-height: 30px;
  border: 0;
  border-radius: 999px;
  color: #fff;
  background: transparent;
  cursor: pointer;
  font-size: 0.72rem;
  font-weight: 800;
  transition: color 0.2s ease, background 0.2s ease;
}

body.scrolled .lang-switch {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transform: translateY(-8px);
}

.lang-btn.active {
  background: #fff;
  color: var(--sea);
}

.hero-inner {
  width: min(1180px, 100%);
  margin: 0 auto 0 0;
  padding-top: 7.5rem;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(280px, 420px);
  gap: clamp(1.5rem, 5vw, 4rem);
  align-items: end;
}

.eyebrow {
  display: inline-flex;
  width: fit-content;
  margin-bottom: 1rem;
  border-left: 4px solid var(--gold);
  padding-left: 0.75rem;
  color: #fff1bd;
  font-size: 0.76rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

#familyBadge {
  border-left-color: var(--olive);
  color: var(--olive);
}

h1 {
  max-width: 760px;
  font-family: "Playfair Display", serif;
  font-size: clamp(3.36rem, 10.4vw, 8.4rem);
  line-height: 0.82;
  letter-spacing: 0;
  color: #fff;
  text-shadow: 0 5px 30px rgba(0, 0, 0, 0.48);
}

h1 span {
  display: block;
  color: #ffdc8b;
}

.hero-copy {
  max-width: 680px;
  margin-top: 1.15rem;
  color: #f7fbfb;
  font-size: clamp(1rem, 2vw, 1.25rem);
  line-height: 1.65;
  text-shadow: 0 2px 18px rgba(0, 0, 0, 0.44);
}

.hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem;
  margin-top: 1.55rem;
}

.cta {
  min-height: 46px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid rgba(255, 255, 255, 0.35);
  border-radius: 999px;
  padding: 0 1.1rem;
  color: #fff;
  background: rgba(10, 18, 20, 0.48);
  text-decoration: none;
  font-weight: 800;
  backdrop-filter: blur(14px);
}

.weather {
  align-self: end;
  justify-self: end;
  margin-bottom: clamp(0.5rem, 5vh, 4rem);
  transform: translateX(clamp(2.5rem, 7vw, 5.5rem));
  border: 1px solid rgba(255, 255, 255, 0.28);
  border-radius: 8px;
  padding: 1rem;
  background: rgba(7, 18, 22, 0.9);
  backdrop-filter: blur(18px);
  box-shadow: var(--shadow);
}

.weather-head {
  display: flex;
  align-items: start;
  justify-content: space-between;
  gap: 1rem;
  padding-bottom: 0.9rem;
  border-bottom: 1px solid rgba(255, 255, 255, 0.22);
}

.weather-kicker,
.panel-kicker {
  color: #d7edf0;
  font-size: 0.72rem;
  font-weight: 900;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.weather-place {
  display: block;
  margin-top: 0.25rem;
  color: #fff;
  font-family: "Playfair Display", serif;
  font-size: 1.65rem;
  line-height: 1;
}

.weather-temp {
  color: #ffdc8b;
  font-size: 2.25rem;
  font-weight: 800;
  line-height: 1;
  white-space: nowrap;
}

.weather-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.65rem;
  margin-top: 0.9rem;
}

.weather-item {
  min-height: 78px;
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 8px;
  padding: 0.75rem;
  background: rgba(255, 255, 255, 0.16);
}

.weather-item span {
  display: block;
  color: #d7edf0;
  font-size: 0.7rem;
  font-weight: 900;
  text-transform: uppercase;
}

.weather-item strong {
  display: block;
  margin-top: 0.25rem;
  color: #fff;
  font-size: 1rem;
}

.weather-note {
  margin-top: 0.75rem;
  color: #eef8f7;
  font-size: 0.84rem;
  line-height: 1.45;
}

.weather-days {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.45rem;
  margin-top: 0.85rem;
}

.weather-day {
  min-height: 66px;
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 8px;
  padding: 0.55rem;
  background: rgba(255, 255, 255, 0.1);
}

.weather-day span {
  display: block;
  color: #d7edf0;
  font-size: 0.62rem;
  font-weight: 900;
  text-transform: uppercase;
}

.weather-day strong {
  display: block;
  margin-top: 0.2rem;
  color: #fff;
  font-size: 0.92rem;
}

.weather-day small {
  display: block;
  margin-top: 0.15rem;
  color: rgba(255, 255, 255, 0.76);
  font-size: 0.68rem;
  line-height: 1.25;
}

.overview {
  display: grid;
  align-items: center;
  padding: clamp(5rem, 8vw, 7rem) clamp(1rem, 4vw, 3rem) clamp(2rem, 4vw, 3rem);
  color: var(--ink);
  background:
    linear-gradient(120deg, rgba(255, 248, 233, 0.96), rgba(223, 240, 239, 0.9)),
    url("dia 5 foto 2.jfif") center / cover;
}

.overview-inner {
  width: min(1180px, 100%);
  margin: 0 auto;
  display: grid;
  grid-template-columns: minmax(0, 0.95fr) minmax(300px, 1fr);
  gap: clamp(1.5rem, 5vw, 4rem);
  align-items: center;
}

.section-title {
  font-family: "Playfair Display", serif;
  font-size: clamp(2.7rem, 7vw, 6.5rem);
  line-height: 0.92;
  letter-spacing: 0;
}

.section-text {
  margin-top: 1rem;
  max-width: 560px;
  color: #3b322a;
  font-size: 1.05rem;
  line-height: 1.7;
}

.family-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0.85rem;
}

.family-tip {
  min-height: 155px;
  border: 1px solid var(--soft-line);
  border-radius: 8px;
  padding: 1rem;
  background: rgba(255, 255, 255, 0.92);
  box-shadow: 0 18px 50px rgba(21, 18, 15, 0.08);
}

.family-tip span {
  display: inline-grid;
  width: 38px;
  height: 38px;
  place-items: center;
  border-radius: 8px;
  margin-bottom: 0.8rem;
  background: var(--sea-soft);
  color: var(--sea);
  font-weight: 900;
}

.family-tip strong {
  display: block;
  font-size: 1.05rem;
}

.family-tip p {
  margin-top: 0.45rem;
  color: #42372e;
  line-height: 1.55;
  font-size: 0.94rem;
}

.culture {
  display: grid;
  align-items: center;
  padding: clamp(5rem, 8vw, 7rem) clamp(1rem, 4vw, 3rem) clamp(2rem, 4vw, 3rem);
  color: #fff;
  background:
    linear-gradient(90deg, rgba(14, 42, 48, 0.96), rgba(14, 42, 48, 0.58)),
    url("dia 4 foto 2.jfif") center / cover;
}

.culture-inner {
  width: min(1180px, 100%);
  margin: 0 auto;
  display: grid;
  grid-template-columns: minmax(0, 0.78fr) minmax(320px, 1fr);
  gap: clamp(1.5rem, 5vw, 4rem);
  align-items: center;
}

.culture .section-text {
  color: #eef8f7;
}

.culture-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0.85rem;
}

.culture-tip {
  min-height: 178px;
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 8px;
  padding: 1rem;
  background: rgba(8, 24, 29, 0.72);
  backdrop-filter: blur(16px);
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.16);
}

.culture-tip span {
  display: inline-flex;
  align-items: center;
  min-height: 28px;
  border-radius: 999px;
  margin-bottom: 0.75rem;
  padding: 0 0.65rem;
  background: rgba(255, 220, 139, 0.18);
  color: #ffdc8b;
  font-size: 0.72rem;
  font-weight: 900;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.culture-tip strong {
  display: block;
  font-size: 1.08rem;
}

.culture-tip p {
  margin-top: 0.45rem;
  color: #edf7f6;
  line-height: 1.55;
  font-size: 0.94rem;
}

.day {
  display: grid;
  grid-template-columns: minmax(312px, 0.58fr) minmax(420px, 1fr);
  background: #0d1719;
}

.photo-carousel {
  position: relative;
  min-height: 100svh;
  overflow: hidden;
}

.slides {
  height: 100%;
  display: flex;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scrollbar-width: thin;
  scrollbar-color: rgba(255, 255, 255, 0.34) transparent;
}

.slides::-webkit-scrollbar {
  height: 3px;
}

.slides::-webkit-scrollbar-track {
  background: transparent;
}

.slides::-webkit-scrollbar-thumb {
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.34);
}

.slide {
  position: relative;
  min-width: 100%;
  height: 100svh;
  scroll-snap-align: start;
}

.slide::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(90deg, rgba(10, 13, 14, 0.32), rgba(10, 13, 14, 0)),
    linear-gradient(0deg, rgba(10, 13, 14, 0.42), rgba(10, 13, 14, 0.02) 45%);
}

.slide img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
}

.swipe-hint {
  position: absolute;
  z-index: 4;
  left: clamp(0.65rem, 2vw, 1rem);
  bottom: clamp(0.65rem, 2vw, 1rem);
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  border: 1px solid rgba(255, 255, 255, 0.22);
  border-radius: 999px;
  padding: 0.28rem 0.55rem;
  background: rgba(8, 15, 17, 0.62);
  color: #fff;
  backdrop-filter: blur(10px);
  font-size: 0.68rem;
  font-weight: 800;
}

.photo-controls {
  position: absolute;
  z-index: 5;
  right: clamp(0.65rem, 2vw, 1rem);
  bottom: clamp(0.65rem, 2vw, 1rem);
  display: flex;
  gap: 0.35rem;
}

.photo-btn {
  width: 34px;
  height: 34px;
  border: 1px solid rgba(255, 255, 255, 0.26);
  border-radius: 999px;
  color: #fff;
  background: rgba(8, 15, 17, 0.64);
  backdrop-filter: blur(10px);
  cursor: pointer;
  font-size: 1rem;
  line-height: 1;
}

.day-panel {
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 1.2rem;
  padding: clamp(5rem, 9vw, 7rem) clamp(1rem, 4vw, 2rem) clamp(2rem, 4vw, 3rem);
  background:
    linear-gradient(180deg, rgba(255, 252, 244, 0.99), rgba(255, 248, 233, 0.96)),
    var(--cream);
  color: var(--ink);
}

.day-label {
  width: fit-content;
  border: 1px solid rgba(198, 92, 62, 0.22);
  border-radius: 999px;
  padding: 0.34rem 0.7rem;
  color: #8e321e;
  background: rgba(198, 92, 62, 0.13);
  font-size: 0.74rem;
  font-weight: 900;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.day-title {
  margin-top: 0.7rem;
  max-width: 780px;
  font-family: "DM Sans", sans-serif;
  font-size: clamp(2.05rem, 4.6vw, 3.65rem);
  font-weight: 800;
  line-height: 1.02;
  letter-spacing: 0;
}

.day-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 0.55rem;
}

.badge {
  min-height: 34px;
  display: inline-flex;
  align-items: center;
  border: 1px solid rgba(12, 93, 112, 0.2);
  border-radius: 999px;
  padding: 0 0.75rem;
  color: #083f4d;
  background: #dff0ef;
  font-size: 0.82rem;
  font-weight: 900;
}

.day-weather {
  color: #61430b;
  background: #fff0c2;
  border-color: rgba(227, 181, 81, 0.42);
}

.blocks {
  display: grid;
  gap: 0.75rem;
}

.block {
  border-top: 1px solid var(--soft-line);
  padding-top: 0.8rem;
}

.block-label {
  color: #405124;
  font-size: 0.76rem;
  font-weight: 900;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.block-text {
  margin-top: 0.25rem;
  color: #2d261f;
  line-height: 1.55;
}

.map-link {
  display: inline-flex;
  margin-top: 0.4rem;
  color: #9b3821;
  font-size: 0.84rem;
  font-weight: 900;
  text-decoration: none;
}

.map-link:hover { text-decoration: underline; }

.footer {
  min-height: 28svh;
  display: grid;
  place-items: center;
  padding: clamp(1rem, 3vw, 2rem);
  color: #fff;
  background:
    linear-gradient(90deg, rgba(13, 38, 46, 0.96), rgba(13, 38, 46, 0.54)),
    url("dia 3 foto 1.jfif") center / cover;
  text-align: center;
}

.footer strong {
  display: block;
  font-family: "Playfair Display", serif;
  font-size: clamp(1.2rem, 3.5vw, 2.7rem);
  line-height: 0.95;
}

.footer span {
  display: block;
  max-width: 680px;
  margin: 1rem auto 0;
  color: rgba(255, 255, 255, 0.9);
  line-height: 1.6;
}

@media (max-width: 920px) {
  html { scroll-snap-type: none; }

  .topbar {
    align-items: start;
    grid-template-columns: auto 1fr;
    gap: 0.6rem;
  }

  .site-menu {
    grid-column: 1 / -1;
    order: 3;
    justify-self: stretch;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .site-menu::-webkit-scrollbar { display: none; }

  .lang-switch {
    justify-self: end;
    max-width: 86px;
    overflow: hidden;
  }

  .lang-btn {
    min-width: 38px;
    padding: 0 0.45rem;
    font-size: 0;
  }

  .lang-btn::before {
    content: attr(data-lang);
    font-size: 0.64rem;
    text-transform: uppercase;
  }

  .hero-inner,
  .overview-inner,
  .culture-inner,
  .day {
    grid-template-columns: 1fr;
  }

  .weather {
    max-width: 560px;
    width: 100%;
    margin: 0;
    order: 2;
    transform: none;
  }

  .photo-carousel,
  .slide {
    min-height: 43svh;
    height: 43svh;
  }

  .day-panel {
    min-height: 57svh;
  }
}

@media (max-width: 640px) {
  .topbar {
    top: 0.65rem;
    width: calc(100% - 1rem);
  }

  .brand-pill {
    max-width: 38vw;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  .site-menu {
    min-height: 40px;
  }

  .menu-link {
    min-width: max-content;
    padding: 0 0.7rem;
    font-size: 0.78rem;
  }

  .lang-btn {
    min-width: 34px;
  }

  h1 {
    font-size: clamp(2.52rem, 12vw, 3.64rem);
    line-height: 0.88;
  }

  .hero-inner {
    padding-top: 8.6rem;
    align-items: start;
    gap: 1.15rem;
  }

  .weather {
    padding: 0.85rem;
  }

  .day-panel {
    padding-top: 2rem;
  }

  .day-title {
    font-size: clamp(1.8rem, 9vw, 2.55rem);
  }

  .weather-grid,
  .weather-days,
  .family-grid,
  .culture-grid {
    grid-template-columns: 1fr;
  }

  .weather-grid {
    gap: 0.45rem;
  }

  .weather-head {
    display: block;
  }

  .weather-temp {
    display: block;
    margin-top: 0.7rem;
  }

  .photo-controls {
    right: 1rem;
  }

  .swipe-hint {
    max-width: calc(100% - 7.5rem);
  }
}
</style>
</head>
<body>
<nav class="topbar" aria-label="Langue">
  <div class="brand-pill">Tindari Experience</div>
  <div class="site-menu" aria-label="Menu principal">
    <a class="menu-link" href="#inicio" id="menuHome"></a>
    <a class="menu-link" href="#famille" id="menuFamily"></a>
    <a class="menu-link" href="#culture" id="menuCulture"></a>
    <a class="menu-link" href="#jour-1" id="menuRoute"></a>
  </div>
  <div class="lang-switch" id="langSwitch">
    <button class="lang-btn active" type="button" data-lang="fr">Français</button>
    <button class="lang-btn" type="button" data-lang="pt">Português</button>
  </div>
</nav>

<header class="screen hero" id="inicio">
  <div class="hero-inner">
    <div>
      <div class="eyebrow" id="heroBadge"></div>
      <h1 id="heroTitle"></h1>
      <p class="hero-copy" id="heroCopy"></p>
      <div class="hero-actions">
        <a class="cta" href="#jour-1" id="heroCta"></a>
        <a class="cta" href="#famille" id="familyCta"></a>
        <a class="cta" href="#culture" id="cultureCta"></a>
      </div>
    </div>

    <aside class="weather" aria-live="polite">
      <div class="weather-head">

  el("cultureBadge").textContent = data.ui.cultureBadge;
  el("cultureTitle").textContent = data.ui.cultureTitle;
  el("cultureText").textContent = data.ui.cultureText;
  el("footerBrand").textContent = data.ui.footerBrand;
  el("footerText").textContent = data.ui.footerText;
}

function renderFamilyTips() {
  el("familyGrid").innerHTML = content[lang].familyTips.map(([number, title, text]) => `
    <article class="family-tip">
      <span>${number}</span>
      <strong>${title}</strong>
      <p>${text}</p>
    </article>
  `).join("");
}

function renderCultureTips() {
  el("cultureGrid").innerHTML = content[lang].cultureTips.map(([place, title, text]) => `
    <article class="culture-tip">
      <span>${place}</span>
      <strong>${title}</strong>
      <p>${text}</p>
    </article>
  `).join("");
}

function renderWeatherDays() {
  const avg = augustAverages[lang];
  el("weatherDays").innerHTML = avg.map(item => `
    <div class="weather-day">
      <span>${item.label}</span>
      <strong>${item.temp}</strong>
      <small>média ago.</small>
    </div>
  `).join("");
}

function renderDays() {
  const data = content[lang];
  el("itinerary").innerHTML = data.days.map((day, index) => `
    <article class="screen day" id="jour-${index + 1}">
      <div class="photo-carousel" data-carousel>
        <div class="slides">
          ${day.photos.map((photo, photoIndex) => `
            <figure class="slide">
              <img src="${photo}" alt="${day.title} - ${photoIndex + 1}" loading="${index === 0 ? "eager" : "lazy"}">
            </figure>
          `).join("")}
        </div>
        <div class="swipe-hint">${data.ui.swipe}</div>
        <div class="photo-controls" aria-label="${data.ui.swipe}">
          <button class="photo-btn" type="button" data-direction="-1" aria-label="Photo précédente">‹</button>
          <button class="photo-btn" type="button" data-direction="1" aria-label="Photo suivante">›</button>
        </div>
      </div>
      <div class="day-panel">
        <div>
          <div class="day-label">${day.label}</div>
          <h2 class="day-title">${day.title}</h2>
        </div>
        <div class="day-meta">
          <span class="badge">${day.distance}</span>
          <span class="badge">${day.rhythm}</span>
        </div>
        <div class="blocks">
          ${day.blocks.map(([label, text, map]) => `
            <div class="block">
              <div class="block-label">${cleanBlockLabel(label)}</div>
              <p class="block-text">${text}</p>
              ${map ? `<a class="map-link" href="${map}" target="_blank" rel="noopener">${data.ui.map}</a>` : ""}
            </div>
          `).join("")}
        </div>
      </div>
    </article>
  `).join("");
}

function renderLangButtons() {
  document.querySelectorAll(".lang-btn").forEach(button => {
    button.classList.toggle("active", button.dataset.lang === lang);
  });
}

function bindCarouselButtons() {
  document.querySelectorAll("[data-carousel]").forEach(carousel => {
    const slides = carousel.querySelector(".slides");
    carousel.querySelectorAll(".photo-btn").forEach(button => {
      button.addEventListener("click", () => {
        const direction = Number(button.dataset.direction);
        slides.scrollBy({ left: direction * slides.clientWidth, behavior: "smooth" });
      });
    });
  });
}

async function loadWeather() {
  const data = content[lang];
  try {
    const url = "https://api.open-meteo.com/v1/forecast?latitude=38.1407&longitude=15.0434&current=temperature_2m,weather_code,wind_speed_10m,precipitation_probability&timezone=Europe%2FRome";
    const response = await fetch(url);
    if (!response.ok) throw new Error("Weather request failed");
    const forecast = await response.json();
    const current = forecast.current;
    const condition = weatherCodes[lang][current.weather_code] || (lang === "fr" ? "Météo variable" : "Tempo variável");

    el("weatherTemp").textContent = `${Math.round(current.temperature_2m)}°`;
    el("weatherWind").textContent = `${Math.round(current.wind_speed_10m)} km/h`;
    el("weatherRain").textContent = `${current.precipitation_probability || 0}%`;
    el("weatherMax").textContent = `${Math.round(current.temperature_2m + 6)}°`; // estimativa
    el("weatherNote").textContent = `${condition}. ${data.ui.weatherNote}`;
  } catch (error) {
    el("weatherTemp").textContent = "26°";
    el("weatherWind").textContent = "12 km/h";
    el("weatherRain").textContent = "10%";
    el("weatherMax").textContent = "32°";
    el("weatherNote").textContent = data.ui.weatherFallback;
  }
}

function render() {
  renderStaticText();
  renderFamilyTips();
  renderCultureTips();
  renderWeatherDays();
  renderDays();
  renderLangButtons();
  bindCarouselButtons();
  loadWeather();
}

el("langSwitch").addEventListener("click", event => {
  const button = event.target.closest(".lang-btn");
  if (!button) return;
  lang = button.dataset.lang;
  render();
});

function updateScrolledState() {
  document.body.classList.toggle("scrolled", window.scrollY > 24);
}

window.addEventListener("scroll", updateScrolledState, { passive: true });
updateScrolledState();

render();
</script>
</body>
</html>
